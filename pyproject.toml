[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "arxiv-digest"
version = "0.3.0"
description = "每日抓取指定 arXiv 分类的最新论文，按关键词打分排序并生成 Markdown 日报的命令行 Agent，附桌面检索客户端"
readme = "README.md"
license = "MIT"
authors = [{ name = "XiaoMa-77" }]
requires-python = ">=3.11"
dependencies = ["pyyaml"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
desktop = ["pywebview>=5"]
dev = ["ruff", "pytest"]

[project.scripts]
arxiv-digest = "arxiv_digest.cli:main"
arxiv-digest-desktop = "arxiv_digest.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
arxiv_digest = ["web/*.html"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
