[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scholar-workbench"
version = "0.2.0"
description = "Research agent: desktop multi-source discovery, on-demand digests, PDF figures, comparison, surveys and MCP."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "pyyaml>=6"]
keywords = ["literature-review", "arxiv", "openalex", "research", "agent", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
pdf = ["pymupdf>=1.24"]
mcp = ["mcp>=1.2,<2"]
desktop = ["pywebview>=5"]
dev = ["pytest>=8.0", "pytest-cov", "ruff", "build"]

[project.scripts]
scholar-workbench = "litreview.cli:main"
scholar-workbench-desktop = "arxiv_digest.desktop:main"
scholar-workbench-mcp = "litreview.mcp_server:main"
litreview = "litreview.cli:main"
litreview-desktop = "arxiv_digest.desktop:main"
arxiv-digest = "arxiv_digest.cli:main"
arxiv-digest-desktop = "arxiv_digest.desktop:main"
litreview-mcp = "litreview.mcp_server:main"

[project.urls]
Repository = "https://github.com/XiaoMa-77/scholar-workbench"
Issues = "https://github.com/XiaoMa-77/scholar-workbench/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests/digest"]
addopts = "--import-mode=importlib"

[tool.setuptools.package-data]
arxiv_digest = ["web/*.html"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
