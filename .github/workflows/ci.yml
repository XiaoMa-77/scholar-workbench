name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -e .[dev]

      - name: Ruff 静态检查
        run: ruff check .

      - name: Pytest 单元测试
        run: pytest -q
