name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package with test dependencies
        run: python -m pip install -e ".[pdf,mcp,dev]"
      - name: Run offline test suite
        run: python -m pytest tests -q
      - name: Lint source code
        run: python -m ruff check src
      - name: CLI smoke test
        run: |
          litreview --help
          litreview search --help
          litreview survey --help
          litreview digest --help
          arxiv-digest --version
      - name: MCP server imports cleanly
        run: python -c "import litreview.mcp_server"
      - name: Compile all sources
        run: python -m compileall -q src tests
      - name: Build wheel and source distribution
        run: python -m build
