<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>arXiv Scholar Search</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --ink: #16181d; --ink-2: #5c6470;
    --line: #e6e8ec; --accent: #4f46e5; --accent-2: #7c3aed;
    --accent-soft: #eef0fe; --good: #0f9d58; --warn: #b45309;
    --shadow: 0 1px 2px rgba(20,22,26,.05), 0 8px 28px rgba(20,22,26,.07);
    --radius: 14px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    font-family:-apple-system,"Segoe UI","Noto Sans SC","Microsoft YaHei",sans-serif;
    background:
      radial-gradient(1200px 500px at 85% -10%, #ede9fe55, transparent 60%),
      radial-gradient(900px 400px at -10% 0%, #e0e7ff55, transparent 55%),
      var(--bg);
    color:var(--ink); font-size:14px; padding:28px 34px 40px;
  }
  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-thumb { background:#d2d6dd; border-radius:8px; border:2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background:#b8bec8; }

  /* ---------- 顶栏 ---------- */
  header { display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; }
  .brand { display:flex; align-items:center; gap:12px; }
  .logo {
    width:38px; height:38px; border-radius:11px; flex:none;
    background:linear-gradient(135deg, var(--accent), var(--accent-2));
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:700; font-size:17px;
    box-shadow:0 6px 16px -6px var(--accent);
  }
  .brand h1 { font-size:18px; font-weight:650; letter-spacing:.2px; }
  .brand p { font-size:12px; color:var(--ink-2); margin-top:2px; }
  .sources { display:flex; gap:8px; }
  .src {
    font-size:11.5px; color:var(--ink-2); background:var(--card);
    border:1px solid var(--line); border-radius:20px; padding:5px 12px;
    display:flex; align-items:center; gap:6px; transition:.2s;
  }
  .src .dot { width:6px; height:6px; border-radius:50%; background:var(--good); }
  .src.dim .dot { background:#c2c8d0; }
  .src:hover { border-color:#c9cdd4; transform:translateY(-1px); }

  /* ---------- 检索卡片 ---------- */
  .search-card {
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:20px 22px; margin-bottom:20px;
    transition:box-shadow .3s;
  }
  .search-card:focus-within { box-shadow:0 1px 2px rgba(20,22,26,.05), 0 12px 36px rgba(79,70,229,.12); }
  .inputrow { display:flex; gap:12px; }
  .query-wrap { flex:1; position:relative; }
  .query-wrap svg { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:#9aa1ac; }
  #query {
    width:100%; font-size:15px; padding:13px 16px 13px 42px;
    border:1.5px solid var(--line); border-radius:11px; outline:none;
    background:#fbfcfd; transition:border-color .2s, background .2s;
    font-family:inherit;
  }
  #query:focus { border-color:var(--accent); background:#fff; }
  #query::placeholder { color:#a8aeb8; }
  .btn-primary {
    padding:0 26px; border:none; border-radius:11px; cursor:pointer;
    background:linear-gradient(135deg, var(--accent), var(--accent-2)); color:#fff;
    font-size:14.5px; font-weight:600; font-family:inherit; letter-spacing:.3px;
    transition:transform .15s, box-shadow .2s, filter .2s;
    box-shadow:0 6px 18px -8px var(--accent);
    display:flex; align-items:center; gap:8px; white-space:nowrap;
  }
  .btn-primary:hover { transform:translateY(-1px); filter:brightness(1.05); box-shadow:0 10px 24px -8px var(--accent); }
  .btn-primary:active { transform:scale(.97); }
  .btn-primary:disabled { opacity:.7; cursor:wait; }
  .spinner { width:15px; height:15px; border:2px solid #fff5; border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite; display:none; }
  .busy .spinner { display:block; } .busy .label { display:none; }
  @keyframes spin { to { transform:rotate(360deg); } }

  .filters { display:flex; align-items:center; gap:10px; margin-top:14px; flex-wrap:wrap; }
  .flabel { font-size:11.5px; color:var(--ink-2); font-weight:600; letter-spacing:.4px; }
  .chip {
    font-size:12.5px; padding:5.5px 13px; border-radius:20px; cursor:pointer;
    border:1px solid var(--line); background:#fbfcfd; color:var(--ink-2);
    transition:all .18s; user-select:none; font-family:inherit;
  }
  .chip:hover { border-color:var(--accent); color:var(--accent); transform:translateY(-1px); }
  .chip.on {
    background:var(--accent-soft); border-color:var(--accent); color:var(--accent); font-weight:600;
    box-shadow:inset 0 0 0 1px var(--accent);
  }
  select {
    font-size:12.5px; padding:6px 10px; border-radius:9px; border:1px solid var(--line);
    background:#fbfcfd; color:var(--ink); outline:none; font-family:inherit; cursor:pointer;
    transition:border-color .2s;
  }
  select:hover { border-color:#c9cdd4; }
  .llm-chip { margin-left:auto; }
  .llm-chip .chip { display:flex; gap:6px; align-items:center; }
  .hint { font-size:11.5px; color:#9aa1ac; margin-top:11px; }

  /* ---------- 结果区 ---------- */
  .toolbar { display:flex; align-items:center; gap:12px; margin-bottom:12px; min-height:30px; }
  .stats { font-size:12.5px; color:var(--ink-2); }
  .stats b { color:var(--ink); }
  .toolbar .grow { flex:1; }
  .btn-ghost {
    font-size:12.5px; padding:7px 14px; border-radius:9px; cursor:pointer;
    border:1px solid var(--line); background:var(--card); color:var(--ink-2);
    font-family:inherit; transition:all .18s; display:flex; align-items:center; gap:6px;
  }
  .btn-ghost:hover { border-color:var(--accent); color:var(--accent); transform:translateY(-1px); }
  .btn-ghost:active { transform:scale(.96); }

  .paper-list { display:flex; flex-direction:column; gap:10px; }
  .paper {
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:15px 18px; display:flex; gap:16px; align-items:flex-start;
    cursor:pointer; transition:transform .18s, box-shadow .22s, border-color .2s;
    animation:fadeUp .45s cubic-bezier(.2,.7,.3,1) both;
  }
  .paper:hover { transform:translateY(-2px); box-shadow:var(--shadow); border-color:#d6dae0; }
  @keyframes fadeUp { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }

  .rank { width:34px; flex:none; text-align:center; font-size:19px; font-weight:700; color:#c6ccd6; padding-top:2px; transition:color .2s; }
  .paper:hover .rank { color:var(--accent); }
  .main { flex:1; min-width:0; }
  .title { font-size:14.5px; font-weight:600; line-height:1.45; margin-bottom:5px; }
  .title a { color:var(--ink); text-decoration:none; }
  .title a:hover { color:var(--accent); }
  .meta { font-size:12px; color:var(--ink-2); display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .cat { background:#f2f4f7; border-radius:5px; padding:1px 7px; font-size:11px; }
  .venue { color:var(--warn); font-weight:600; font-size:11.5px; }
  .side { width:230px; flex:none; display:flex; gap:18px; justify-content:flex-end; padding-top:2px; }
  .metric { width:86px; }
  .metric .num { font-size:15px; font-weight:700; }
  .metric .num small { font-size:10.5px; color:var(--ink-2); font-weight:500; margin-left:2px; }
  .metric .name { font-size:10.5px; color:var(--ink-2); margin:2px 0 5px; letter-spacing:.3px; }
  .bar { height:5px; border-radius:4px; background:#edeff2; overflow:hidden; }
  .bar i { display:block; height:100%; width:0; border-radius:4px; transition:width .9s cubic-bezier(.2,.7,.3,1); }
  .rel i { background:linear-gradient(90deg, var(--accent), var(--accent-2)); }
  .imp i { background:linear-gradient(90deg, #0ea5e9, var(--good)); }
  .cite-note { font-size:10.5px; color:#9aa1ac; margin-top:4px; }

  /* ---------- 骨架屏 ---------- */
  .skel { height:76px; border-radius:12px; border:1px solid var(--line); background:var(--card);
          position:relative; overflow:hidden; }
  .skel::after {
    content:""; position:absolute; inset:0;
    background:linear-gradient(100deg, transparent 30%, #f0f2f5 50%, transparent 70%);
    animation:shimmer 1.3s infinite; transform:translateX(-100%);
  }
  @keyframes shimmer { to { transform:translateX(100%); } }

  .empty {
    text-align:center; padding:60px 0; color:var(--ink-2); font-size:13.5px;
    background:var(--card); border:1px dashed var(--line); border-radius:12px;
  }
  .empty .big { font-size:34px; margin-bottom:10px; }

  /* ---------- 详情弹窗 ---------- */
  .overlay {
    position:fixed; inset:0; background:rgba(18,20,26,.35); backdrop-filter:blur(6px);
    display:none; align-items:center; justify-content:center; z-index:50; padding:30px;
    opacity:0; transition:opacity .22s;
  }
  .overlay.show { display:flex; opacity:1; }
  .modal {
    width:min(760px, 94vw); max-height:86vh; overflow:auto; background:var(--card);
    border-radius:16px; box-shadow:0 24px 80px rgba(10,12,20,.3); padding:26px 28px;
    transform:scale(.94) translateY(10px); transition:transform .25s cubic-bezier(.2,.7,.3,1);
  }
  .overlay.show .modal { transform:none; }
  .modal h2 { font-size:17.5px; line-height:1.5; margin-bottom:14px; padding-right:36px; }
  .close {
    position:absolute; right:26px; top:24px; width:30px; height:30px; border-radius:9px;
    border:none; background:#f2f4f7; color:var(--ink-2); cursor:pointer; font-size:15px;
    transition:all .18s;
  }
  .close:hover { background:#e8eaee; color:var(--ink); transform:rotate(90deg); }
  .grid { display:grid; grid-template-columns:repeat(4, 1fr); gap:10px; margin-bottom:16px; }
  .cell { background:#f8f9fb; border-radius:10px; padding:10px 12px; }
  .cell .k { font-size:10.5px; color:var(--ink-2); letter-spacing:.4px; margin-bottom:3px; }
  .cell .v { font-size:15px; font-weight:700; }
  .cell .v small { font-weight:500; color:var(--ink-2); }
  .sec-label { font-size:11.5px; color:var(--ink-2); font-weight:600; letter-spacing:.4px; margin:14px 0 7px; }
  .abstract { font-size:13px; line-height:1.75; color:#33383f; }
  .abstract.zh { color:var(--ink); background:var(--accent-soft); border-radius:10px; padding:12px 14px; }
  .kw-row { display:flex; gap:7px; flex-wrap:wrap; }
  .kw { font-size:11.5px; background:var(--accent-soft); color:var(--accent); border-radius:6px; padding:3px 9px; animation:fadeUp .4s both; }
  .llm-note { font-size:12.5px; background:#fffbeb; border:1px solid #fde68a; color:#92400e; border-radius:9px; padding:9px 13px; line-height:1.6; }
  .modal .actions { display:flex; gap:10px; margin-top:18px; flex-wrap:wrap; }

  /* ---------- Toast ---------- */
  #toast {
    position:fixed; left:50%; bottom:34px; transform:translate(-50%, 80px); z-index:99;
    background:#1d2026; color:#fff; font-size:13px; padding:11px 22px; border-radius:12px;
    box-shadow:0 10px 34px rgba(0,0,0,.3); opacity:0; transition:all .3s cubic-bezier(.2,.7,.3,1);
    pointer-events:none; max-width:80vw;
  }
  #toast.show { transform:translate(-50%, 0); opacity:1; }
</style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo">A</div>
      <div>
        <h1>arXiv Scholar Search</h1>
        <p>论文检索 · 相关度排序 · 学术影响力分析</p>
      </div>
    </div>
    <div class="sources">
      <div class="src"><span class="dot"></span>arXiv API</div>
      <div class="src" id="src-s2"><span class="dot"></span>Semantic Scholar</div>
      <div class="src dim" id="src-llm"><span class="dot"></span>LLM 精排</div>
    </div>
  </header>

  <div class="search-card">
    <div class="inputrow">
      <div class="query-wrap">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="query" placeholder="输入关键词（多个词取交集）或研究方向描述，如：vision-language navigation 具身智能" spellcheck="false">
      </div>
      <button class="btn-primary" id="go"><span class="spinner"></span><span class="label">检 索</span></button>
    </div>
    <div class="filters">
      <span class="flabel">分类</span>
      <div id="cats" style="display:flex;gap:8px;flex-wrap:wrap"></div>
      <span class="flabel" style="margin-left:6px">数量</span>
      <select id="limit"><option>10</option><option selected>30</option><option>50</option><option>100</option></select>
      <span class="flabel">时间</span>
      <select id="days">
        <option value="0" selected>不限</option><option value="7">近一周</option>
        <option value="30">近一月</option><option value="90">近三月</option><option value="365">近一年</option>
      </select>
      <div class="llm-chip"><button class="chip" id="llm" title="配置 LLM_API_KEY 后可用：相关性 0-10 精排 + 摘要中译">✨ LLM 精排</button></div>
    </div>
    <div class="hint">引用与 venue 数据来自 Semantic Scholar；"学术影响力"为引用量对数综合分（0-10），非期刊影响因子。按 Enter 检索。</div>
  </div>

  <div class="toolbar">
    <div class="stats" id="stats">输入关键词开始检索，或直接查看示例方向。</div>
    <div class="grow"></div>
    <select id="sort" style="display:none">
      <option value="rel" selected>按相关度排序</option>
      <option value="cites">按引用数排序</option>
      <option value="impact">按影响力分排序</option>
      <option value="date">按发表时间排序</option>
    </select>
    <button class="btn-ghost" id="csv" style="display:none">⬇ 导出 CSV</button>
    <button class="btn-ghost" id="md" style="display:none">⬇ 导出 Markdown</button>
  </div>

  <div class="paper-list" id="list"></div>
  <div id="empty" class="empty" style="display:none"><div class="big">🔍</div>没有检索到符合条件的论文，换个关键词或放宽分类试试。</div>

  <div class="overlay" id="overlay">
    <div class="modal" style="position:relative">
      <button class="close" id="close">✕</button>
      <div id="modal-body"></div>
    </div>
  </div>
  <div id="toast"></div>

<script>
"use strict";
const $ = (s) => document.querySelector(s);
const list = $("#list");
let ROWS = [];
let llmOn = false;

const CATS = ["cs.CV", "cs.CL", "cs.AI", "cs.LG", "cs.RO", "cs.IR", "stat.ML"];
const selected = new Set(["cs.CV"]);

function toast(msg) {
    const t = $("#toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(t._h);
    t._h = setTimeout(() => t.classList.remove("show"), 2400);
}

/* 分类 chips */
function renderCats() {
    const box = $("#cats");
    box.innerHTML = "";
    for (const c of CATS) {
        const b = document.createElement("button");
        b.className = "chip" + (selected.has(c) ? " on" : "");
        b.textContent = c;
        b.onclick = () => { selected.has(c) ? selected.delete(c) : selected.add(c); renderCats(); };
        box.appendChild(b);
    }
}

/* 分数条：先插入 0 宽，下一帧再赋值触发过渡 */
function fillBars(root) {
    requestAnimationFrame(() => requestAnimationFrame(() => {
        root.querySelectorAll(".bar i").forEach((el) => { el.style.width = el.dataset.w + "%"; });
    }));
}

function bar(v, cls, max) {
    const pct = v == null ? 0 : Math.min(100, Math.round(v / max * 100));
    return `<div class="bar ${cls}"><i data-w="${pct}"></i></div>`;
}

function rowHtml(r, i) {
    const cite = r.citations == null ? "—" : r.citations.toLocaleString();
    const infl = r.influential == null ? "—" : r.influential.toLocaleString();
    const rel = (r.llm_score != null ? r.score + r.llm_score : r.score);
    const relMax = Math.max(10, ...ROWS.map(x => (x.llm_score != null ? x.score + x.llm_score : x.score)));
    const venue = r.venue ? `<span class="venue">${escapeHtml(r.venue)}</span>` : "";
    return `<div class="paper" style="animation-delay:${Math.min(i * 45, 500)}ms" data-i="${i}">
      <div class="rank">${String(i + 1).padStart(2, "0")}</div>
      <div class="main">
        <div class="title"><a href="${r.link}" target="_blank">${escapeHtml(r.title)}</a></div>
        <div class="meta">
          <span>${escapeHtml(r.authors.join(", "))}</span>
          <span>${r.published}</span>
          ${r.categories.slice(0, 3).map((c) => `<span class="cat">${c}</span>`).join("")}
          ${venue}
        </div>
      </div>
      <div class="side">
        <div class="metric">
          <div class="num">${rel.toFixed(1)}<small>/10+</small></div>
          <div class="name">相关度${r.llm_score != null ? " ✨" : ""}</div>
          ${bar(rel, "rel", relMax)}
        </div>
        <div class="metric">
          <div class="num">${r.impact_score == null ? "—" : r.impact_score.toFixed(1)}</div>
          <div class="name">影响力</div>
          ${bar(r.impact_score, "imp", 10)}
          <div class="cite-note">引用 ${cite} · 高影响 ${infl}</div>
        </div>
      </div>
    </div>`;
}

function renderRows(rows) {
    ROWS = rows;
    list.innerHTML = rows.map(rowHtml).join("");
    fillBars(list);
    list.querySelectorAll(".paper").forEach((el) => {
        el.onclick = (e) => {
            if (e.target.closest("a")) return;
            openModal(ROWS[+el.dataset.i]);
        };
    });
    $("#empty").style.display = rows.length ? "none" : "block";
    const show = rows.length > 0;
    $("#sort").style.display = show ? "" : "none";
    $("#csv").style.display = show ? "" : "none";
    $("#md").style.display = show ? "" : "none";
}

function sortRows() {
    const key = $("#sort").value;
    const val = (r) => ({
        rel: (r.llm_score != null ? r.score + r.llm_score : r.score),
        cites: r.citations == null ? -1 : r.citations,
        impact: r.impact_score == null ? -1 : r.impact_score,
        date: r.published,
    }[key]);
    renderRows([...ROWS].sort((a, b) => val(b) - val(a)));
    $("#sort").value = key;
}

function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

/* 详情弹窗 */
function openModal(r) {
    const cite = r.citations == null ? "—" : r.citations.toLocaleString();
    const body = $("#modal-body");
    body.innerHTML = `
      <h2><a href="${r.link}" target="_blank" style="color:inherit;text-decoration:none">${escapeHtml(r.title)}</a></h2>
      <div class="grid">
        <div class="cell"><div class="k">规则相关度</div><div class="v">${r.score}</div></div>
        <div class="cell"><div class="k">LLM 相关性</div><div class="v">${r.llm_score == null ? "—" : r.llm_score + " <small>/10</small>"}</div></div>
        <div class="cell"><div class="k">引用 / 高影响</div><div class="v">${cite} <small>/ ${r.influential == null ? "—" : r.influential.toLocaleString()}</small></div></div>
        <div class="cell"><div class="k">影响力分</div><div class="v">${r.impact_score == null ? "—" : r.impact_score}</div></div>
        <div class="cell"><div class="k">arXiv 编号</div><div class="v" style="font-size:12.5px">${escapeHtml(r.arxiv_id)}</div></div>
        <div class="cell"><div class="k">提交日期</div><div class="v" style="font-size:13px">${r.published}</div></div>
        <div class="cell"><div class="k">正式发表</div><div class="v" style="font-size:12.5px">${escapeHtml(r.venue || "预印本")}</div></div>
        <div class="cell"><div class="k">分类</div><div class="v" style="font-size:12px">${escapeHtml(r.categories.join(" · "))}</div></div>
      </div>
      ${r.matched.length ? `<div class="sec-label">命中关键词</div><div class="kw-row">${r.matched.map((k) => `<span class="kw">${escapeHtml(k)}</span>`).join("")}</div>` : ""}
      ${r.llm_reason ? `<div class="sec-label">LLM 评述</div><div class="llm-note">${escapeHtml(r.llm_reason)}（相关性 ${r.llm_score}/10）</div>` : ""}
      <div class="sec-label">摘要（原文）</div>
      <div class="abstract" id="abs-en">${escapeHtml(r.abstract)}</div>
      <div id="abs-zh-slot">${r.abstract_zh ? `<div class="sec-label">摘要（中译${"LLM"})</div><div class="abstract zh">${escapeHtml(r.abstract_zh)}</div>` : ""}</div>
      <div class="actions">
        <button class="btn-ghost" id="copy-bib">⧉ 复制引用（BibTeX）</button>
        <button class="btn-ghost" onclick="window.open('${r.link}')" target="_blank">↗ 打开原文</button>
      </div>`;
    $("#overlay").classList.add("show");
    $("#copy-bib").onclick = () => {
        const bib = `@misc{${r.arxiv_id.replace(/\W/g, "")},\n  title={${r.title}},\n  year={${r.published.slice(0, 4)}},\n  eprint={${r.arxiv_id}},\n  archivePrefix={arXiv},\n  url={${r.link}}\n}`;
        navigator.clipboard.writeText(bib).then(() => toast("BibTeX 已复制到剪贴板"), () => toast("复制失败"));
    };
}

/* 桥接调用：优先 pywebview，回退演示数据 */
async function callApi(fn, ...args) {
    if (window.pywebview && window.pywebview.api) {
        const raw = await window.pywebview.api[fn](...args);
        return JSON.parse(raw);
    }
    if (fn === "search" && window.__DEMO__) { await new Promise((r) => setTimeout(r, 350)); return window.__DEMO__; }
    return null;
}

function skeleton(n) {
    list.innerHTML = Array.from({ length: n }, () => `<div class="skel"></div>`).join("");
    $("#empty").style.display = "none";
}

async function doSearch() {
    const q = $("#query").value.trim();
    if (!q) { toast("请输入关键词或研究方向"); return; }
    const btn = $("#go");
    btn.disabled = true; btn.classList.add("busy");
    skeleton(5);
    $("#stats").innerHTML = "检索中…";
    try {
        const res = await callApi("search", q, JSON.stringify([...selected]),
                                  +$("#limit").value, $("#days").value, llmOn);
        if (!res || !res.ok) { throw new Error(res ? res.error : "桌面桥接不可用"); }
        renderRows(res.rows);
        $("#src-s2").classList.toggle("dim", !res.impact_available);
        $("#stats").innerHTML = `共 <b>${res.rows.length}</b> 篇 · 相关度 + 影响力已计算 · 耗时 <b>${res.elapsed}s</b>${res.impact_available ? "" : " · <b>影响力数据暂不可用</b>"}`;
    } catch (e) {
        list.innerHTML = "";
        $("#stats").textContent = "";
        toast(String(e.message || e));
    } finally {
        btn.disabled = false; btn.classList.remove("busy");
    }
}

/* 导出 */
function download(name, text, mime) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], { type: mime }));
    a.download = name;
    a.click();
    URL.revokeObjectURL(a.href);
}

function toMarkdown() {
    const lines = [`# 检索结果 · ${ROWS.length} 篇`, ""];
    ROWS.forEach((r, i) => {
        lines.push(`## ${i + 1}. ${r.title}`);
        lines.push(`- 作者：${r.authors.join(", ")} ｜ ${r.published} ｜ ${r.categories.join(" / ")}`);
        lines.push(`- 相关度 ${r.score}${r.llm_score != null ? `（LLM ${r.llm_score}/10）` : ""} ｜ 引用 ${r.citations ?? "—"} ｜ 影响力 ${r.impact_score ?? "—"}${r.venue ? ` ｜ ${r.venue}` : ""}`);
        lines.push(`- 链接：${r.link}`);
        lines.push("");
    });
    return lines.join("\n");
}

/* 事件绑定 */
$("#go").onclick = doSearch;
$("#query").addEventListener("keydown", (e) => { if (e.key === "Enter") doSearch(); });
$("#sort").onchange = sortRows;
$("#csv").onclick = async () => {
    let text;
    if (window.pywebview && window.pywebview.api) {
        text = await window.pywebview.api.export_csv(JSON.stringify(ROWS));
    } else {
        const head = "标题,作者,发表日期,分类,相关度,LLM相关性,引用数,影响力分,链接\n";
        text = head + ROWS.map((r) => `"${r.title.replace(/"/g, '""')}","${r.authors.join(", ")}",${r.published},"${r.categories.join("/")}",${r.score},${r.llm_score ?? ""},${r.citations ?? ""},${r.impact_score ?? ""},${r.link}`).join("\n");
    }
    download("arxiv-检索结果.csv", "\ufeff" + text, "text/csv");
    toast("CSV 已导出");
};
$("#md").onclick = () => { download("arxiv-检索结果.md", toMarkdown(), "text/markdown"); toast("Markdown 已导出"); };
$("#llm").onclick = () => {
    llmOn = !llmOn;
    $("#llm").classList.toggle("on", llmOn);
    toast(llmOn ? "LLM 精排已开启（需配置 LLM_API_KEY）" : "LLM 精排已关闭");
};
$("#close").onclick = () => $("#overlay").classList.remove("show");
$("#overlay").onclick = (e) => { if (e.target === e.currentTarget) $("#overlay").classList.remove("show"); };
document.addEventListener("keydown", (e) => { if (e.key === "Escape") $("#overlay").classList.remove("show"); });

/* 初始化 */
renderCats();
(async () => {
    const info = await callApi("llm_available").catch(() => null);
    if (info && info.available) {
        $("#src-llm").classList.remove("dim");
        $("#llm").classList.add("on");
        llmOn = true;
    }
})();
if (window.__DEMO__) {
    $("#query").value = window.__DEMO__.query || "";
    renderRows(window.__DEMO__.rows);
    $("#stats").innerHTML = `共 <b>${window.__DEMO__.rows.length}</b> 篇 · 相关度 + 影响力已计算 · 演示数据`;
}
</script>
</body>
